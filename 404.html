<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পেজ পাওয়া যায়নি - 404</title>
<link rel="stylesheet" href="style.css">
<style>
  .error-container {
    text-align: center;
    padding: 80px 20px;
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .error-code {
    font-size: 6rem;
    font-weight: bold;
    color: #2e7d32;
    margin: 0;
  }
  .error-message {
    font-size: 1.5rem;
    margin: 10px 0 30px;
    color: #333;
  }
  .home-link {
    display: inline-block;
    padding: 12px 30px;
    background-color: #2e7d32;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 1rem;
  }
  .home-link:hover {
    background-color: #1b5e20;
  }
</style>
</head>
<body>

<div class="error-container">
  <p class="error-code">404</p>
  <p class="error-message">দুঃখিত, আপনি যে পেজটি খুঁজছেন তা পাওয়া যায়নি।</p>
  <a href="index.html" class="home-link">হোম পেজে ফিরে যান</a>
</div>

</body>
</html>
